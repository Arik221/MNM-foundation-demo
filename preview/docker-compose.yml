# Local-only WordPress + MariaDB for previewing the theme and plugin. Usage: docker compose up -d
# The database is not published outside the compose network. Do NOT use these example credentials anywhere real.
services:
  db:
    image: mariadb:10.11
    environment: { MARIADB_DATABASE: wp, MARIADB_USER: wp, MARIADB_PASSWORD: wp, MARIADB_RANDOM_ROOT_PASSWORD: "yes" }
    volumes: [dbdata:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    volumes:
      - wpdata:/var/www/html
      - ../mnm-foundation-theme:/var/www/html/wp-content/themes/mnm-foundation-theme
      - ../mnm-foundation-core:/var/www/html/wp-content/plugins/mnm-foundation-core
volumes: { dbdata: {}, wpdata: {} }
